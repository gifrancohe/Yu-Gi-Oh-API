<div class="list"
    infiniteScroll
    [infiniteScrollDistance]="2"
    [infiniteScrollThrottle]="100"
    (scrolled)="onScroll()"
>
    <label for="card-search">Search</label>
    <input id="card-search" type="text" placeholder="Search..." class="form-control mb-3" [formControl]="cardTextFC" />

    <div class="cards">
        <app-card *ngFor="let card of cards" [card]="card"></app-card>
    </div>
</div>
